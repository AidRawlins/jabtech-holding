<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JAB Tech Services — TPA Services for the Insurance Sector</title>
<meta name="description" content="JAB Tech Services: TPA (third party agent) services for the insurance sector.">
<style>
 :root{--navy:#13263a;--steel:#3c5a78;--ink:#16202b;--soft:#f3f5f8;--line:#dfe4ea}
 *{box-sizing:border-box}
 body{margin:0;font:16px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:#fff}
 .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
 header{background:var(--navy);color:#fff;padding:56px 0 48px;text-align:center}
 .brand{font-weight:800;letter-spacing:.04em;font-size:clamp(28px,5vw,44px);margin:0}
 .tag{margin:10px 0 0;font-size:clamp(18px,2.6vw,24px);color:#cfdbe8}
 main{padding:36px 0 44px}
 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
 figure{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 figure img{display:block;width:100%;height:auto;aspect-ratio:10/7;object-fit:cover}
 figcaption{padding:10px 14px;font-weight:600}
 .contact{text-align:center;margin:36px 0 0;font-size:17px}
 .contact a{color:var(--steel);font-weight:600}
 footer{border-top:1px solid var(--line);color:#5b6672;font-size:13px;text-align:center;padding:18px 0}
 @media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
 @media (max-width:520px){.grid{grid-template-columns:1fr} header{padding:40px 0 34px}}
 @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
 <h1 class="brand">JAB Tech Services</h1>
 <p class="tag">TPA Services for the Insurance Sector</p>
</div></header>
<main><div class="wrap">
 <div class="grid">
    <figure><img src="images/phone-repair.jpg" alt="Technician in gloves repairing a smartphone" width="800" height="560" loading="lazy"><figcaption>Technology repairs</figcaption></figure>
  <figure><img src="images/windscreen-repair.jpg" alt="Car windscreen with a large crack" width="800" height="560" loading="lazy"><figcaption>Windscreen repairs</figcaption></figure>
  <figure><img src="images/vehicle-claim.jpg" alt="Car with a dented front bumper" width="800" height="560" loading="lazy"><figcaption>Vehicle claim assessment</figcaption></figure>
  <figure><img src="images/home-damage.jpg" alt="House surrounded by floodwater" width="800" height="560" loading="lazy"><figcaption>Home damage</figcaption></figure>
  <figure><img src="images/marine-damage.jpg" alt="Sailboat partly sunk beside a rocky shore" width="800" height="560" loading="lazy"><figcaption>Marine damage</figcaption></figure>
  <figure><img src="images/break-in.jpg" alt="Smashed window pane" width="800" height="560" loading="lazy"><figcaption>Break-in and theft</figcaption></figure>
 </div>
 <p class="contact">Contact: <a href="mailto:hello@jabtechservices.com">hello@jabtechservices.com</a></p>
</div></main>
<footer><div class="wrap">© 2026 JAB Tech Services</div></footer>
</body>
</html>
